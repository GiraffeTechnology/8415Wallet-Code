name: Wallet fixed candidate validation
'on':
  push:
    branches:
    - ci/wallet-candidate-15164dd
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate:
    name: Fixed candidate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node:
        - '22'
        - '24'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with: &id001
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Import immutable draft and verify exact source tree
      env: &id002
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/import-wallet-candidate.py
    - name: Install
      shell: bash
      run: 'set -euo pipefail

        cd "$WALLET_CANDIDATE_SOURCE" || exit 1

        snapshot_guard() { git diff --quiet && git diff --cached --quiet && test "$(git write-tree)" = 15164dd9f90426f8bf3af9b1ed6a1898510df253;
        }

        snapshot_guard || { echo "candidate_source_integrity_failed"; exit 65; }

        log="$RUNNER_TEMP/candidate-check-2.private.log"

        set +e

        bash -e -o pipefail <<''CANDIDATE_COMMAND'' >"$log" 2>&1

        npm ci

        CANDIDATE_COMMAND

        status=$?

        set -e

        snapshot_guard || { echo "candidate_source_integrity_failed"; exit 65; }

        python3 - "$log" "$status" <<''SAFE_SUMMARY''

        import hashlib,json,pathlib,re,sys

        p=pathlib.Path(sys.argv[1]);data=p.read_bytes()

        # Emit fixed-shape counters only; no source, test descriptions, addresses or stack traces.

        counts={k:[int(n) for n in re.findall(rb''^# ''+k.encode()+rb'' (\d+)\s*$'',data,re.M)] for k in (''tests'',''pass'',''fail'',''skipped'')}

        print(json.dumps({''exit_code'':int(sys.argv[2]),''log_sha256'':hashlib.sha256(data).hexdigest(),''tap_counts'':counts,''diagnostic_codes'':sorted(set(x.decode()
        for x in re.findall(rb''\b(?:ERR_[A-Z_]+|TS[0-9]{4})\b'',data))),''failed_test_name_sha256'':[hashlib.sha256(x).hexdigest()
        for x in re.findall(rb''^not ok [0-9]+ - (.*)$'',data,re.M)]}))

        SAFE_SUMMARY

        exit "$status"

        '
    - name: Typecheck
      shell: bash
